<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel expense claim capture and approval</title>

    <script>
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            enableSearch: false
                        }
                    }
                }
            },
            applications: {}
        };
    </script>

    <script
        id="sap-ushell-bootstrap"
        src="https://ui5.sap.com/1.120.0/test-resources/sap/ushell/bootstrap/sandbox.js">
    </script>

    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m,sap.ushell,sap.ui.layout,sap.fe.templates"
        data-sap-ui-compat-version="edge"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted">
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container
                .createRenderer("fiori2", true)
                .then(function (renderer) {
                    renderer.placeAt("content");
                });
        });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
